name: Bilet Takip

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bilet-takip
  cancel-in-progress: false

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklar
        run: pip install requests

      - name: Takibi calistir
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bilet_takip.py

      - name: Durumu kaydet
        run: |
          git config user.name "bilet-takip-bot"
          git config user.email "actions@github.com"
          git add durum.json || true
          if git diff --staged --quiet; then
            echo "Degisiklik yok."
          else
            git commit -m "durum guncellendi [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi
